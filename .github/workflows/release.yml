name: Release
on:
  push:
    tags:
      - "v**"

permissions:
  contents: write
  packages: write

env:
  FORCE_COLOR: "1"
  CAPTAIN_VERBOSE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load shared config
        run: cat .github/config.env >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Pull release artifacts
        run: |
          uv run captain --flavor-id trixie-full release --target combined pull --pull-output release-artifacts
          uv run captain --flavor-id trixie-slim release --target combined pull --pull-output release-artifacts
          uv run captain --flavor-id trixie release --target combined pull --pull-output release-artifacts/trixie
          uv run captain --flavor-id trixie-armbian-rpi release --target arm64 pull --pull-output release-artifacts
          uv run captain --flavor-id trixie-rockchip64 release --target arm64 pull --pull-output release-artifacts
          uv run captain --flavor-id trixie-meson64 release --target arm64 pull --pull-output release-artifacts
          uv run captain --flavor-id trixie-rockchip64-vendor release --target arm64 pull --pull-output release-artifacts
          uv run captain --flavor-id trixie-genio release --target arm64 pull --pull-output release-artifacts

      - name: "directories -> tarball"
        working-directory: out/release-artifacts
        run: |
          for dir in */; do
              # if not a directory, skip
              [[ ! -d "$dir" || "$dir" == "." || "$dir" == ".." ]] && continue
              tarball="${dir%/}.tar.gz"
              echo "Creating tarball for '$dir' -> '$tarball'"
              tar -czf "${dir%/}.tar.gz" "$dir"
              echo "Removing directory '$dir'"
              rm -rf "$dir"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            out/release-artifacts/* \
            --generate-notes \
            --title "${{ github.ref_name }}"

      - name: Tag (trixie-full)
        run: uv run captain --flavor-id trixie-full release tag --new-tag "${{ github.ref_name }}"

      - name: Tag (trixie-slim)
        run: uv run captain --flavor-id trixie-slim release tag --new-tag "${{ github.ref_name }}-slim"

      - name: Tag (trixie)
        run: uv run captain --flavor-id trixie release tag --new-tag "${{ github.ref_name }}-trixie"

      - name: Tag (trixie-armbian-rpi)
        run: uv run captain --flavor-id trixie-armbian-rpi --arch arm64 release tag --new-tag "${{ github.ref_name }}-rpi"

      - name: Tag (trixie-rockchip64)
        run: uv run captain --flavor-id trixie-rockchip64 --arch arm64 release tag --new-tag "${{ github.ref_name }}-rockchip64"

      - name: Tag (trixie-meson64)
        run: uv run captain --flavor-id trixie-meson64 --arch arm64 release tag --new-tag "${{ github.ref_name }}-meson64"

      - name: Tag (trixie-rockchip64-vendor)
        run: uv run captain --flavor-id trixie-rockchip64-vendor --arch arm64 release tag --new-tag "${{ github.ref_name }}-rockchip64-vendor"

      - name: Tag (trixie-genio)
        run: uv run captain --flavor-id trixie-genio --arch arm64 release tag --new-tag "${{ github.ref_name }}-genio"
